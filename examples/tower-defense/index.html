<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HyperNova — Tower Defense</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0d0d1a;
      color: #ccc;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 1.4rem;
      color: #8BE9FD;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 16px;
    }

    #game {
      border: 2px solid #333;
      border-radius: 4px;
      cursor: crosshair;
      image-rendering: pixelated;
      max-width: 100%;
      height: auto;
    }

    .controls {
      margin-top: 12px;
      font-size: 0.8rem;
      color: #666;
      text-align: center;
      line-height: 1.6;
    }

    .controls kbd {
      background: #222;
      border: 1px solid #444;
      border-radius: 3px;
      padding: 1px 5px;
      font-family: inherit;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>HyperNova Tower Defense</h1>
  <p class="subtitle">Built with the HyperNova ECS Engine</p>
  <canvas id="game"></canvas>
  <div class="controls">
    <kbd>1</kbd>–<kbd>4</kbd> Select tower &nbsp;|&nbsp;
    <kbd>Click</kbd> Place tower &nbsp;|&nbsp;
    <kbd>Right-click</kbd> / <kbd>Space</kbd> Start wave early
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
