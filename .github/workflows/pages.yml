# Deploy the HyperNova engine examples to GitHub Pages.
# Site: https://hypernovasystem.github.io/hypernova/
#
# Builds both engine examples and publishes them under a landing page:
#   /hypernova/                -> examples/index.html
#   /hypernova/tower-defense/  -> examples/tower-defense
#   /hypernova/nitrogen-pump/  -> examples/nitrogen-pump

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress stays false per the official Pages pattern: in-flight
# production deployments complete; queued runs are still skipped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22

      - run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0

      # outDir is relative to each example root (examples/<name>).
      - name: Build examples
        run: |
          for ex in tower-defense nitrogen-pump; do
            npm run "build:$ex" -- --base ./ --outDir "../../_site/$ex" --emptyOutDir
          done
          cp examples/index.html _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
